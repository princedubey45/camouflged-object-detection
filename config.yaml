# Training Parameters
batch_size: 2              # was 4 → reduced for 6GB GPU
batch_size_valid: 1
epochs: 30
lr: 1e-6                   # was 1e-5 → reduced to fix NaN
weight_decay: 0.0001
rand_seed: 42
precisionHigh: false

# Dataset Configuration
train_dir: ../COD10K-v3/Train
test_dir: ../COD10K-v3/Test
load_all: false

# Model Configuration
backbone: pvt_v2_b5
img_size: 256              # was 320 → reduced to save GPU memory
lateral_channels: [512, 320, 128, 64]
resume: "checkpoints/escnet/new_epoch_25.pth"
compile: false
use_frequency_branch: false
frequency_mode: fft
use_amp: true              # keep ON → saves memory with mixed precision

# Multi-GPU Settings
device_ids: [0]
multi_GPU: false

# Save Settings
save_model_dir: checkpoints
name: escnet
save_last: 50
save_step: 5

# Data Augmentation
preproc_methods:
  - flip
  - rotate
  - crop

# Path Settings
weights:
  pvt_v2_b2: checkpoints/escnet/new_epoch_25.pth
  pvt_v2_b4: checkpoints/escnet/new_epoch_25.pth
  pvt_v2_b5: ../../pvt_v2_b5.pth

# System
num_workers: 2